# ================================ Configurations ================================

DEVICE_CODE="dipper"                     #   Device codename (ensure this matches your device)
WIN_MIN_SIZE=30                        #   Minimum required size for Windows partition (in GB)
ESP_MIN_SIZE=349                       #   Minimum required size for ESP partition (in MB)
REQUIRED_BATTERY=50                    #   Minimum battery percentage required to proceed with the installation
WIN_PART_NAME="WINDIPPER"                #   Label/name for the Windows partition to used during formatting
ESP_PART_NAME="ESPDIPPER"                #   Label/name for the ESP partition to used during formatting in winpe
SECURE_BOOT="FALSE"                     #   Write "FALSE" if the uefi not support secure boot 	
WINDOWS_EDITIONS=(
  "Windows 11 Pro"
  "Windows 11 IoT Enterprise LTSC"
  "Windows 11 Enterprise LTSC"
  "Windows 11 Enterprise"
  "Windows 11 Home"
  "Windows 10 Pro"
  "Windows 10 Home"
)                                      #  Priority-ordered list of supported Windows editions.
DEVICE_NAME="Mi 8"             #  Name of the device
WI_VERSION="WinInstaller_Dipper_idk"  #  Version-device for the Wininstaller
BUID_DATE="14Feb_2026                #  Build date of the installer
MAINTAINER="Project-Aloha,map220v,remtrik And idk"
# ============================== Configurations End ==============================
